[workspace]
members = [".", "crates/gpu-probe"]
resolver = "3"

[package]
name = "harm"
version = "0.1.0"
edition = "2024"
rust-version = "1.100"
license = "MIT OR Apache-2.0"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[[bin]]
name = "harm"
path = "src/main.rs"
