[workspace]
members = [".", "crates/gpu-probe", "crates/predict-cost"]
resolver = "3"

[package]
name = "harm"
version = "0.1.0"
edition = "2024"
rust-version = "1.100"
license = "MIT OR Apache-2.0"
default-run = "harm"

[dependencies]
clap = { version = "4", features = ["derive"] }
gpu-probe = { path = "crates/gpu-probe" }
libm = "0.2"
rustix = { version = "1", features = ["process", "thread", "time"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"

[[bin]]
name = "harm"
path = "src/main.rs"
