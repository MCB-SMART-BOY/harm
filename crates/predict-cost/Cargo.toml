[package]
name = "predict-cost"
version = "0.1.0"
edition = "2024"
rust-version = "1.100"
license = "MIT OR Apache-2.0"

[dependencies]
bytemuck = "1.25.2"
clap = { version = "4", features = ["derive"] }
gpu-probe = { path = "../gpu-probe" }
pollster = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
wgpu = { version = "27", features = ["vulkan"] }
